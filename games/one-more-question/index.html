<body>
<title>你会被骗吗？</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Pixelify+Sans:wght@500&family=ZCOOL+QingKe+HuangYou&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one fixed screen like a handheld. Top bar → pixel scene → dialogue → a control panel whose contents swap. Notes, verdict results and endings slide up as sheets. Nothing scrolls the page. */
:root {
  --bg: #15122a; --surface: #221c3d; --ink: #f4e6c8; --muted: #a399c0; --line: #3a3157;
  --you: #ffcf70; --good: #6fd08c; --bad: #ff7a6b; --sky: #9fe3ea; --shadow: #0a0816;
  --f-display: "Pixelify Sans", "ZCOOL QingKe HuangYou", "Noto Sans SC", sans-serif;
  --f-body: "Noto Sans SC", "PingFang SC", sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); background-image: radial-gradient(#211c3a 1px, transparent 1px); background-size: 8px 8px; color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.55; overflow: hidden;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 0; }
[hidden] { display: none !important; }
.app { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; padding-block: 10px; }
button { font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--line); box-shadow: 3px 3px 0 var(--shadow); padding: 10px 12px; cursor: pointer; text-align: left; touch-action: manipulation; }
button:hover:not(:disabled) { border-color: var(--you); }
button:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--you); border-color: var(--you); color: #15122a; font-weight: 700; text-align: center; }
button.ghost { text-align: center; }
button:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }

.bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bar .t { font-family: var(--f-display); font-size: clamp(15px, 4.6vw, 20px); color: var(--you); text-shadow: 2px 2px 0 var(--shadow); white-space: nowrap; }
.bar .r { display: flex; align-items: center; gap: 6px; white-space: nowrap; font-family: var(--f-num); font-size: 12px; color: var(--muted); }
.bar .r b { color: var(--ink); font-weight: 500; }
.days { display: inline-flex; gap: 3px; vertical-align: -2px; }
.days i { width: 9px; height: 12px; background: var(--you); border: 1px solid #0a0816; }
.days i.used { background: #3a3157; }
.bar .nb { white-space: nowrap; padding: 4px 8px; font-size: 13px; box-shadow: 2px 2px 0 var(--shadow); font-family: var(--f-body); }
.bar .nb.ping { border-color: var(--you); color: var(--you); animation: ping 1s steps(2) 3; }
@keyframes ping { 50% { border-color: var(--line); } }

.scene { flex: none; position: relative; width: min(100%, calc(32vh * 16 / 9)); align-self: center; aspect-ratio: 16 / 9; border: 2px solid var(--shadow); }
.scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.scene .tag { position: absolute; font-family: var(--f-display); font-size: clamp(12px, 3.2vw, 15px); color: #f4e6c8; text-shadow: 2px 2px 0 #000; pointer-events: none; transform: translateX(-50%); white-space: nowrap; }

.talk { flex: none; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; border: 2px solid #f4e6c8; background: #0f0c1d; padding: 10px; box-shadow: 4px 4px 0 var(--shadow); min-height: 92px; cursor: pointer; }
.talk canvas { width: 44px; height: 44px; image-rendering: pixelated; border: 2px solid var(--line); background: #2e2650; }
.talk .who { font-family: var(--f-display); color: var(--you); font-size: 15px; line-height: 1.2; }
.talk .say { font-size: 14.5px; }
.talk { position: relative; padding-right: 44px; }
.talk .prev { position: absolute; right: 6px; bottom: 6px; width: 32px; height: 28px; padding: 0; text-align: center; font-size: 12px; box-shadow: 2px 2px 0 var(--shadow); background: #221c3d; }
.talk .prev:disabled { opacity: .25; }
.talk .log { position: absolute; right: 6px; top: 6px; width: 32px; height: 28px; padding: 0; text-align: center; font-size: 16px; line-height: 1; box-shadow: 2px 2px 0 var(--shadow); background: #221c3d; }
.loglist { display: grid; gap: 8px; }
.logline { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 14px; }
.logline canvas { width: 30px; height: 30px; image-rendering: pixelated; border: 2px solid var(--line); background: #2e2650; }
.logline b { display: block; font-family: var(--f-display); color: var(--you); font-weight: 500; font-size: 13px; }
.logline.ask > div { border-left: 3px solid var(--you); padding-left: 8px; }
.talk .more { float: right; color: var(--you); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.panel { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 2px 4px 4px 2px; }
.panel .q { font-weight: 700; font-size: 15px; }
.panel .hint { font-size: 12px; color: var(--muted); }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.act { display: flex; flex-direction: column; gap: 2px; font-size: 14px; line-height: 1.35; min-height: 58px; }
.act .cost { font-family: var(--f-num); font-size: 11px; color: var(--muted); }
.act.done { border-style: dashed; }
.foot { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; margin-top: auto; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opts.three { grid-template-columns: repeat(3, 1fr); }
.opts.two { grid-template-columns: repeat(2, 1fr); }
.opts button { text-align: center; padding: 9px 6px; font-size: 14px; }
.opts button.on { border-color: var(--you); color: var(--you); }
.conf { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--muted); }
.conf b { font-family: var(--f-num); color: var(--you); }
input[type=range] { width: 100%; accent-color: var(--you); height: 28px; }
.labrow { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }

.sheet { position: fixed; inset: 0; z-index: 20; background: #0a0816c8; display: flex; align-items: flex-end; justify-content: center; padding: 0 12px env(safe-area-inset-bottom, 0px); }
.sheet-in { width: min(480px, 100%); max-height: 86%; overflow-y: auto; background: var(--surface); border: 2px solid var(--you); box-shadow: 0 -4px 0 var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 10px; animation: up .3s cubic-bezier(.2,.8,.2,1) both; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 30px; color: var(--you); line-height: 1.15; }
.sub { color: var(--muted); font-size: 13px; margin: 0; }
.notes { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.notes div { border-left: 3px solid var(--sky); padding-left: 10px; }
.chart { width: 100%; height: auto; image-rendering: pixelated; border: 2px solid var(--shadow); background: #110e22; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: -1px; }
.ex { background: #2b2440; padding: 10px 12px; font-size: 14.5px; }
.name { font-family: var(--f-display); font-size: 26px; color: var(--you); }
.res-good { color: var(--good); font-weight: 700; } .res-bad { color: var(--bad); font-weight: 700; }
.tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.tools div { border: 2px solid var(--line); padding: 8px 10px; font-size: 13px; }
.tools .on { border-color: #5a4a2e; background: #2b2440; } .tools .on b { color: var(--you); }
.tools .off { color: #5d5478; }
.starrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.postcard { position: relative; width: 84px; height: 84px; flex: none; display: grid; place-items: center; }
.postcard::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: radial-gradient(circle, #ffcf7066 0%, #ffcf7022 45%, transparent 70%); animation: glow 2.4s 1s ease-in-out infinite alternate, fadeIn .4s .5s both; }
.postcard img { position: relative; width: 72px; height: 72px; image-rendering: pixelated; filter: drop-shadow(0 3px 0 #0007); animation: cardIn .7s .5s cubic-bezier(.34,1.8,.5,1) both, wiggle 2s 1.3s ease-in-out infinite; transform-origin: 50% 90%; }
.postcard .newtag { position: absolute; top: -4px; left: -6px; font: 11px/1 var(--f-display); color: #1b1730; background: #ff7a6b; padding: 4px 6px 3px; border: 2px solid #1b1730; box-shadow: 2px 2px 0 #0008; transform: rotate(-12deg); animation: tagIn .4s 1s cubic-bezier(.34,1.8,.5,1) both, tagPulse 1s 1.4s ease-in-out infinite; }
@keyframes wiggle { 0%, 55%, 100% { transform: rotate(0); } 62% { transform: rotate(-10deg); } 69% { transform: rotate(9deg); } 76% { transform: rotate(-7deg); } 83% { transform: rotate(5deg); } 90% { transform: rotate(-2deg); } }
@keyframes tagIn { from { transform: scale(0) rotate(-40deg); } to { transform: rotate(-12deg); } }
@keyframes tagPulse { 50% { transform: rotate(-12deg) scale(1.12); } }
.postcard i { position: absolute; width: 6px; height: 6px; background: var(--you); clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); opacity: 0; animation: spark 1.6s ease-out infinite; }
.postcard i:nth-child(1) { left: 6px; top: 10px; animation-delay: 1s; }
.postcard i:nth-child(2) { right: 4px; top: 4px; width: 9px; height: 9px; animation-delay: 1.4s; }
.postcard i:nth-child(3) { right: 10px; bottom: 6px; animation-delay: 1.9s; }
.postcard i:nth-child(4) { left: 12px; bottom: 2px; width: 8px; height: 8px; animation-delay: 2.3s; }
@keyframes cardIn { from { transform: scale(0) rotate(-12deg); opacity: 0; } 60% { opacity: 1; } to { transform: none; opacity: 1; } }
@keyframes glow { to { transform: scale(1.15); opacity: .7; } }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes spark { 0% { opacity: 0; transform: scale(.2); } 30% { opacity: 1; transform: scale(1) rotate(45deg); } 100% { opacity: 0; transform: scale(.4) rotate(90deg); } }
@media (prefers-reduced-motion: reduce) { .postcard img, .postcard::before, .postcard i { animation: none; opacity: 1; } .postcard i { display: none; } .postcard .newtag { animation: none; } }
.bboard { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
.bcell { aspect-ratio: 1; min-width: 0; padding: 1px; border: 2px solid var(--line); background: #1a1531; box-shadow: none; display: grid; place-content: center; text-align: center; font-size: 10px; line-height: 1.15; overflow: hidden; color: var(--muted); }
.bcell .q { display: block; font-family: var(--f-display); font-size: 15px; line-height: 1; color: var(--line); }
.bcell .where { display: block; font-size: 9px; }
.bcell.on { background: #3a2f18; border-color: var(--you); color: var(--you); font-weight: 700; }
.bcell.free { background: repeating-linear-gradient(45deg, #2e2650 0 4px, #261f44 4px 8px); border-color: var(--muted); font-family: var(--f-display); font-size: 12px; }
.bcell.inline { background: var(--you); border-color: #fff3cf; color: var(--bg); }
.bcell.near { border-color: var(--bad); border-style: dashed; }
.bdetail { border: 2px solid var(--line); padding: 6px 10px; font-size: 13.5px; }
.bdetail b { color: var(--you); }
.bhint { font-size: 13.5px; border-left: 4px solid var(--bad); padding: 6px 10px; background: #2a1f3a; }
.bhint b { color: var(--you); }
.shelf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.slot { border: 2px solid var(--line); padding: 4px 2px 3px; text-align: center; font-size: 11px; color: var(--muted); display: grid; justify-items: center; }
.slot img { width: 32px; height: 32px; image-rendering: pixelated; }
.slot.got { border-color: var(--you); color: var(--ink); }
.slot .lock { font-family: var(--f-display); font-size: 20px; height: 32px; line-height: 32px; color: var(--line); }
.bingowin { border: 2px solid var(--you); background: #2b2440; padding: 10px 12px; display: grid; gap: 6px; font-size: 14px; }
.bingowin .bw-t { font-family: var(--f-display); font-size: 30px; color: var(--you); text-shadow: 3px 3px 0 var(--bad); animation: cardIn .6s .3s cubic-bezier(.34,1.8,.5,1) both; }
.bingowin .bw-g { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bingowin .bw-g > b { color: var(--you); }
.gotool { border: 2px solid var(--you); padding: 8px 10px; font-size: 14px; }
.gotool b { color: var(--you); }
@media (max-height: 640px) { .talk { min-height: 76px; } .act { min-height: 50px; } }
.bets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.bets button { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; padding: 10px 4px; font-size: 14px; }
.bets .cost { font-family: var(--f-num); font-size: 11px; color: var(--muted); }
.calib { border: 2px dashed var(--you); padding: 8px 10px; font-size: 14px; color: var(--you); }
.stars { font-family: var(--f-display); font-size: 32px; color: var(--you); letter-spacing: 4px; }
.row2 { display: grid; grid-template-columns: 1fr 1.3fr; gap: 8px; }
.langs { display: flex; gap: 6px; justify-content: flex-end; }
.langs button { padding: 3px 10px; font-size: 13px; box-shadow: 2px 2px 0 var(--shadow); }
.langs button.on { border-color: var(--you); color: var(--you); }
.app.mapmode .scene { width: min(100%, calc(60vh * 160 / 150)); aspect-ratio: 160 / 150; cursor: pointer; }
.app.mapmode .scene .tag.town { font-size: clamp(12px, 3.4vw, 15px); color: #f4e6c8; background: #15122ae0; padding: 0 5px; border: 1px solid #0a0816; text-shadow: none; }
.app.mapmode .scene .tag.town.here { color: #15122a; background: var(--you); }
.maphint { font-family: var(--f-display); font-size: 18px; color: var(--you); text-align: center; animation: blink 1.6s steps(2) infinite; }
.mapsum { display: flex; justify-content: center; gap: 18px; font-family: var(--f-num); font-size: 13px; color: var(--muted); }
.mapsum b { color: var(--ink); font-weight: 500; }
.leftbtn { width: 100%; border: 0; background: none; box-shadow: none; padding: 6px 0; cursor: pointer; }
.tag.town.here .left { background: #1b1730; color: var(--you); }
.lefttown { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; text-align: left; padding: 10px 12px; }
.lefttown b { font-family: var(--f-display); font-weight: 400; font-size: 16px; color: var(--you); }
.lefttown span { font-size: 13px; color: var(--muted); }
.lefttown ul { grid-column: 1 / -1; margin: 0; padding-left: 18px; font-size: 13px; color: var(--ink); }
.tag.town .left { display: inline-block; margin-left: 4px; padding: 0 4px; background: var(--you); color: #1b1730; font-size: 10px; border-radius: 2px; }
.cardwrap { display: flex; justify-content: center; }
.cardwrap canvas, .cardimg { width: min(100%, 300px); height: auto; display: block; margin: 0 auto; box-shadow: 4px 4px 0 var(--shadow); }
.bar .nb.snd { padding: 4px 6px; }
.fooled { border: 2px solid var(--bad); background: #ff7a6b1a; padding: 8px 10px; font-size: 14px; }
.fooled.ok { border-color: var(--good); background: #6fd08c1a; }
.opts.review button:disabled { opacity: 1; }
.opts.review button.on { border-color: var(--good); color: var(--good); }
.opts.review button.mine { border-color: var(--bad); color: var(--bad); }
.aha { font-family: var(--f-body); font-weight: 700; font-size: 19px; line-height: 1.35; color: var(--you); border-left: 4px solid var(--you); padding: 4px 0 4px 12px; }
.missed { border: 2px dashed var(--line); padding: 8px 10px; font-size: 13.5px; display: flex; flex-direction: column; gap: 6px; }
.missed b { color: var(--muted); font-weight: 500; }
.missed span { display: block; font-size: 12px; color: var(--muted); }
.tutpic { font-size: 48px; text-align: center; line-height: 1.2; }
.dots { display: flex; justify-content: center; gap: 6px; } .dots i { width: 8px; height: 8px; background: var(--line); } .dots i.on { background: var(--you); }
.burst { position: absolute; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; z-index: 5; }
.burst::before { content: ""; position: absolute; inset: 0; background: #0a0816; animation: dim 1.3s ease both; }
.burst b { position: relative; font-family: var(--f-num); font-size: clamp(26px, 8vw, 40px); font-weight: 700; line-height: 1; padding: 6px 16px; background: var(--surface); border: 3px solid var(--you); box-shadow: 4px 4px 0 var(--shadow); animation: pop .9s cubic-bezier(.2,1.6,.4,1) both; }
.burst.good b { color: var(--you); } .burst.bad b { color: #e9e3f5; border-color: var(--bad); font-size: clamp(22px, 7vw, 32px); }
.burst i { position: absolute; left: 50%; top: 50%; font-style: normal; font-size: clamp(18px, 5.5vw, 26px); color: var(--you); text-shadow: -2px 0 0 #0a0816, 2px 0 0 #0a0816, 0 -2px 0 #0a0816, 0 2px 0 #0a0816; animation: fly 1s ease-out var(--d) both; }
.scene:has(.burst) #tags { opacity: .12; transition: opacity .2s; }
@keyframes dim { 0% { opacity: 0; } 15% { opacity: .6; } 75% { opacity: .6; } 100% { opacity: 0; } }
@keyframes pop { 0% { transform: scale(.2); opacity: 0; } 30% { transform: scale(1.2); opacity: 1; } 70% { transform: scale(1); opacity: 1; } 100% { transform: scale(1) translateY(-20%); opacity: 0; } }
@keyframes fly { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 1; } 100% { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.1) rotate(180deg); opacity: 0; } }
.scene.shake { animation: shake .4s linear; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
@media (prefers-reduced-motion: reduce) { .burst b, .burst i, .scene.shake { animation: none; } .burst::before { animation: none; opacity: .6; } .burst i { display: none; } }
.goal { position: relative; margin-top: 8px; font-weight: 700; font-size: 16.5px; line-height: 1.45; color: var(--ink); background: #2c2550; border: 2px solid var(--you); box-shadow: 3px 3px 0 var(--shadow); padding: 14px 12px 10px; }
.app.asking .goal { display: none; }
.goal span { position: absolute; top: -11px; left: 10px; font-weight: 700; font-size: 12px; line-height: 1; color: #1b1730; background: var(--you); padding: 4px 8px; }
.resbadge { position: absolute; left: 50%; transform: translateX(-50%); z-index: 2; display: flex; gap: 4px; padding: 4px 12px; background: var(--surface); border: 2px solid var(--you); box-shadow: 3px 3px 0 var(--shadow); pointer-events: none; }
.resbadge i { font-style: normal; font-size: 30px; line-height: 1; color: #5a5175; animation: starpop .45s cubic-bezier(.2,1.8,.4,1) var(--d) both; }
.resbadge i.on { color: var(--you); text-shadow: 2px 2px 0 var(--shadow); }
@keyframes starpop { 0% { transform: scale(0) rotate(-90deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .resbadge i { animation: none; } }
.sheet-in.hasbadge { padding-top: 28px; }
.restabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.restabs button { padding: 6px 8px; font-size: 13.5px; box-shadow: none; }
.restabs button.on { border-color: var(--you); color: var(--you); }
.respane { display: flex; flex-direction: column; gap: 10px; } .respane[hidden] { display: none; }
.tag.town.locked { color: #b9b2cf; background: #15122acc; }
.lockico { width: .7em; height: .9em; fill: #ffcf70; margin-right: .3em; vertical-align: -.05em; shape-rendering: crispEdges; }
.caselist button.locked .lockico { width: 12px; height: 15px; margin: 0; }
.resetbtn { align-self: center; padding: 4px 12px; font-size: 12px; color: var(--muted); box-shadow: none; }
.caselist button.locked { opacity: .7; cursor: default; border-style: dashed; }
.caselist button.locked span, .caselist button.locked em { color: var(--muted); }
.caselist { display: flex; flex-direction: column; gap: 6px; }
.caselist button { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; text-align: left; padding: 8px 10px; font-size: 14px; }

const DAILY_IDS = { causal: ["ice", "shore", "herb"], prob: ["aicheck", "tea", "coach"], dec: ["blindbox", "surgery", "house"], bias: ["sale", "essay", "fly"], evid: ["fund", "pill", "bacon"], meta: ["horoscope", "exam", "fight"] };
const CASE_BY_ID = {};
CHAPTERS.forEach(ch => (ch.cases || []).forEach(c => CASE_BY_ID[c.id] = c));
DAILY_CASES.forEach(c => CASE_BY_ID[c.id] = c);
let casesFor = function (ch, mode) {
  const daily = DAILY_IDS[ch.id].map(id => CASE_BY_ID[id]);
  if (mode === "easy") return daily;
  const classic = (ch.cases || []).filter(c => !DAILY_IDS[ch.id].includes(c.id));
  return [...daily, ...classic];
};

// a fair shuffle that stays the same while you replay the same case attempt
function shuffled(arr, r) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

for (const ch of Object.keys(DAILY_IDS)) {
  const ids = DAILY_IDS[ch], flips = id => !!(TWIST[id]?.alt || MIXED[id]);
  DAILY_IDS[ch] = [...ids.filter(flips), ...ids.filter(id => !flips(id))];

// tools that no case in play gives out would sit locked forever (run last, after every swap above)
{ const given = new Set(["early"]); Object.values(DAILY_IDS).flat().forEach(id => CASE_BY_ID[id].actions?.forEach(a => a.tool && given.add(a.tool)));
  for (let i = TOOLS.length - 1; i >= 0; i--) if (!given.has(TOOLS[i].id)) TOOLS.splice(i, 1); }

// ================= every case rebuilt so that no single clue gives the answer =================
// Pattern: one clue that makes you believe the claim, one that makes you doubt too much,
// and two plain facts that only show the truth when you put them side by side.
// The old "clues conflict" versions are dropped: their notes no longer match the rebuilt clues.
function redo(id, s) {
  const c = CASE_BY_ID[id], e = EN.cases[id];
  if (s.claim) { c.claim = s.claim[0]; e.claim = s.claim[1]; }
  if (s.q) { c.verdict = { ...c.verdict, q: s.q[0] }; e.verdict = { ...e.verdict, q: s.q[1] }; }
  c.actions = s.acts.map(a => ({ id: a.id, go: a.go, cost: a.cost || 1, l: a.zh[0], note: a.zh[1], ...(a.tool ? { tool: a.tool } : {}) }));
  e.actions = Object.fromEntries(s.acts.map(a => [a.id, a.en]));
  const tw = TWIST[id] = TWIST[id] || {};
  if (s.herring) tw.herring = { go: 60, zh: s.herring[0], en: s.herring[1] };
  if (s.alt) tw.alt = { notes: Object.fromEntries(s.acts.filter(a => a.alt).map(a => [a.id, a.alt])), zh: s.alt[0], en: s.alt[1] };
  else delete tw.alt;
  if (s.ex) { c.explain = { ...c.explain, ex: s.ex[0] }; e.explain = { ...e.explain, ex: s.ex[1] }; }
  if (s.opts) HARD[id] = { opts: { zh: s.opts[0], en: s.opts[1] }, t: s.t };
  delete MIXED[id];
}

// ================= three-version cases =================
// The claim has no numbers. Cards give only plain facts, with neutral labels.
// Each version puts different numbers on the cards, and each version has a different right answer,
// so guessing the "sensible-sounding" option doesn't work: you have to put two cards side by side.
function v3(id, s) {
  const c = CASE_BY_ID[id], e = EN.cases[id];
  c.claim = s.claim[0]; e.claim = s.claim[1];
  c.verdict = { ...c.verdict, q: s.q[0] }; e.verdict = { ...e.verdict, q: s.q[1] };
  c.actions = s.cards.map(k => ({ id: k.id, go: k.go, cost: 1, l: k.zh, note: (k.same || k.v[0])[0], ...(k.tool ? { tool: k.tool } : {}) }));
  e.actions = Object.fromEntries(s.cards.map(k => [k.id, [k.en, (k.same || k.v[0])[1]]]));
  TWIST[id] = {
    herring: { go: 60, zh: s.herring[0], en: s.herring[1] },
    versions: s.versions.map((v, i) => ({ ...v, notes: Object.fromEntries(s.cards.filter(k => k.v).map(k => [k.id, k.v[i]])) })),
  };
  HARD[id] = { opts: { zh: s.opts[0], en: s.opts[1] }, t: [0] };
  delete MIXED[id];
}

// ================= a real study behind every case =================
// Each box: what the study found (with a quote from a page we opened), and plainly how close it is to the game's scenario.
const paper = (id, head, zh, en, url, src) => { SOURCES[id] = { head, zh, en, url, src }; };
const HEAD_REAL = ["真实研究（情景是编的）", "Real study (scenario invented)"];
const HEAD_NEAR = ["相关研究（情景是编的）", "Related study (scenario invented)"];

paper("tutor", HEAD_REAL,
  "美国学者 Briggs（2001）研究 SAT 补习：广告常说补习能提高 100 到 200 分，可是跟条件差不多、没补习的学生比，两科加起来只多了大约 20 分。原文说，原始差距被高估，是因为报补习班的学生「tend to be more socioeconomically advantaged, more motivated」（家境比较好、本来就更有动力）。这项研究讲的是美国的考试补习，跟题目里的补习班情况类似。",
  "Briggs (2001) studied SAT coaching: ads promise 100–200 point gains, but compared with similar uncoached students the combined gain was about 20 points. The raw gap is inflated because students who enrol \"tend to be more socioeconomically advantaged, more motivated to improve their scores\". It's about US test prep, which resembles the cram-school case.",
  "https://nepc.colorado.edu/files/Briggs_Theeffectofadmissionstestpreparation.pdf", "Briggs (2001), Chance");
paper("tea", HEAD_REAL,
  "de Langhe 等人（2016）分析了大量网购评分，发现平均星级「are often based on insufficient sample sizes which limits their informativeness」（常常建立在太少的评价上，说明不了什么）。而且消费者「fail to moderate their reliance on the average user rating as a function of sample size」：评价只有几条，大家照样相信那个平均分。",
  "de Langhe et al. (2016) found that average star ratings \"are often based on insufficient sample sizes which limits their informativeness\", and that shoppers \"fail to moderate their reliance on the average user rating as a function of sample size sufficiency.\"",
  "https://merit.url.edu/en/publications/navigating-by-the-stars-investigating-the-actual-and-perceived-va/", "de Langhe, Fernbach & Lichtenstein (2016), Journal of Consumer Research");
paper("blindbox", HEAD_NEAR,
  "Tversky 和 Kahneman（1992）发现，中奖机会很小的时候，人反而愿意冒险，原文叫「risk seeking for gains … of low probability」。这就是为什么彩票、抽奖、盲盒这种「小机会、大奖品」的东西特别吸引人。注意：这是用金钱赌局做的实验，不是直接研究盲盒。",
  "Tversky & Kahneman (1992) found people become \"risk seeking for gains … of low probability\" — which is why lotteries and blind boxes (small chance, big prize) feel tempting. Note: lab money gambles, not blind boxes specifically.",
  "https://ideas.repec.org/a/kap/jrisku/v5y1992i4p297-323.html", "Tversky & Kahneman (1992), Journal of Risk and Uncertainty");
paper("house", HEAD_NEAR,
  "Hoffman（2016）让有经验的生意人在做判断前，可以花钱买额外的信息。原文：「subjects underpay for both types of information」，超过 80% 的人对很准的信息出价太低。也就是说，人常常不愿意花小钱先查清楚。注意：实验是猜网址价格，不是验房；正式发表的版本结果比较复杂（信息没用时，人有时又会出价太高）。",
  "Hoffman (2016) let experienced businesspeople buy extra information before deciding: \"subjects underpay for both types of information\", with over 80% underpaying for highly accurate signals. Note: the task was valuing domain names, not houses, and the published version reports a mixed picture.",
  "https://www.russellsage.org/research/outputs/how-information-under-valued-evidence-framed-field-experiments", "Hoffman (2016), Economic Journal");
paper("fund", HEAD_REAL,
  "Correll 等人（2020）用线上实验发现：「Bar charts with y-axes that don't begin at zero can visually exaggerate effect sizes」（纵轴不从 0 开始的图，会把差别看起来放大）。就算图上清楚标出纵轴被截断，看的人还是会被放大的感觉影响。",
  "Correll et al. (2020) showed in online experiments that \"bar charts with y-axes that don't begin at zero can visually exaggerate effect sizes\" — and the effect held even when the truncation was clearly marked.",
  "https://arxiv.org/abs/1907.02035v2", "Correll, Bertini & Franconeri (2020), CHI");
paper("dogfood", HEAD_NEAR,
  "Morton 和 Torgerson（2003）在《英国医学杂志》提醒：病最严重的时候去治，之后本来就容易好转，所以「Any intervention aimed at a group or characteristic that is very different from the average will appear to be successful」（不管做了什么，看起来都像有效），会让人以为治疗有用。要分清楚，就要有对照。这篇讲的是「本来就会好转」，题目里「同时改了好几样」是另一个相关的坑。",
  "Morton & Torgerson (2003, BMJ): treating something at its worst means it often improves anyway, so \"any intervention aimed at a group or characteristic that is very different from the average will appear to be successful\". You need a comparison to tell. The article covers natural improvement; changing several things at once is a related trap.",
  "https://pmc.ncbi.nlm.nih.gov/articles/PMC1125994", "Morton & Torgerson (2003), BMJ");
paper("breakup", HEAD_REAL,
  "Fischhoff（1975）发现，人一旦知道了结果，就会觉得那个结果「relatively inevitable」（本来就很可能发生），也就是「事后诸葛亮」。注意：后来重做这个实验的研究，结果有成功也有失败；但「事后觉得自己早就知道」这个现象，在很多研究里都出现过。",
  "Fischhoff (1975) found people see known outcomes as \"relatively inevitable in hindsight\". Note: replications of this specific experiment have been mixed, though hindsight bias itself shows up across many studies.",
  "https://psnet.ahrq.gov/issue/hindsight-foresight-effect-outcome-knowledge-judgment-under-uncertainty", "Fischhoff (1975), J. Exp. Psychology");
paper("rain", HEAD_REAL,
  "Murphy 和 Winkler（1977）检查了美国天气预报员的「下雨概率」：说 30% 的日子，大约就有 30% 下雨。原文：「weather forecasters can formulate such forecasts in a reliable manner」（预报员能给出可靠的概率）。所以要判断准不准，要看很多天，不能只看一天。",
  "Murphy & Winkler (1977) checked US precipitation-probability forecasts and found that \"weather forecasters can formulate such forecasts in a reliable manner\" — on 30% days it rained about 30% of the time. Judging a forecast takes many days, not one.",
  "https://ideas.repec.org/a/bla/jorssc/v26y1977i1p41-47.html", "Murphy & Winkler (1977), Applied Statistics");
paper("phd", HEAD_REAL,
  "Arkes 和 Blumer（1985）发现：一开始买季票花得比较多的观众，后来去看的戏也比较多，不是因为戏比较好，而是因为钱已经花了。原文说，这种「沉没成本效应」是「a greater tendency to continue an endeavor」（更想把一件事继续做下去），背后是「the desire not to appear wasteful」（不想显得浪费）。",
  "Arkes & Blumer (1985): theatre-goers who paid more for season tickets attended more plays — not because the plays were better, but because they'd paid. The sunk cost effect is \"a greater tendency to continue an endeavor\", driven by \"the desire not to appear wasteful\".",
  "https://doi.org/10.1016/0749-5978(85)90049-4", "Arkes & Blumer (1985), Organizational Behavior and Human Decision Processes");
paper("colleague", HEAD_NEAR,
  "Nickerson（1998）回顾了大量研究，说「确认偏误」是「the seeking or interpreting of evidence in ways that are partial to existing beliefs」（找证据、解读证据的时候，偏向自己本来就相信的那一边）。觉得「他不喜欢我」以后，就特别容易记住他没打招呼的那几次。这是一篇综述，不是专门研究同事关系。",
  "Nickerson's (1998) review defines confirmation bias as \"the seeking or interpreting of evidence in ways that are partial to existing beliefs\". Once you think \"he dislikes me\", the missed hellos are what you remember. It's a review, not a study of coworkers specifically.",
  "https://doi.org/10.1037/1089-2680.2.2.175", "Nickerson (1998), Review of General Psychology");
paper("chores", HEAD_REAL,
  "Ross 和 Sicoly（1979）发现，一起做事的时候，「individuals tend to accept more responsibility for a joint product than other contributors attribute to them」（每个人都觉得自己做得比别人认为的多）。原因是自己做过的事，比别人做的更容易想起来。研究里也包括了夫妻分担家务的情况。",
  "Ross & Sicoly (1979): \"individuals tend to accept more responsibility for a joint product than other contributors attribute to them\" — our own contributions come to mind more easily. The studies included couples sharing household tasks.",
  "https://doi.org/10.1037/0022-3514.37.3.322", "Ross & Sicoly (1979), Journal of Personality and Social Psychology");
paper("fair", HEAD_REAL,
  "Pronin、Lin 和 Ross（2002）发现，人「see the existence and operation of cognitive and motivational biases much more in others than in themselves」（看得到别人有偏见，看不到自己的）。实验里，大家觉得同学替自己找借口是有偏见，自己找一样的借口却是公平的。这叫「偏见盲点」。",
  "Pronin, Lin & Ross (2002): people \"see the existence and operation of cognitive and motivational biases much more in others than in themselves\". Participants called a peer's self-serving excuses biased but their own identical excuses fair — the \"bias blind spot\".",
  "https://doi.org/10.1177/0146167202286008", "Pronin, Lin & Ross (2002), Personality and Social Psychology Bulletin");
paper("fight", HEAD_NEAR,
  "Pronin、Lin 和 Ross（2002）发现，人很容易看到别人有偏见，却觉得自己很公平；研究者认为这正是很多争吵谈不拢的原因：两边都觉得「我很客观，是你有偏见」。原文：「individuals see the existence and operation of cognitive and motivational biases much more in others than in themselves」。先把对方在意的事说清楚，是打破这个僵局的办法之一。",
  "Pronin, Lin & Ross (2002) found \"individuals see the existence and operation of cognitive and motivational biases much more in others than in themselves\" — which the authors link to why disputes stall: each side feels objective. Restating what the other side cares about is one way out.",
  "https://doi.org/10.1177/0146167202286008", "Pronin, Lin & Ross (2002), Personality and Social Psychology Bulletin");
paper("rumor", HEAD_REAL,
  "Vosoughi、Roy 和 Aral（2018）分析了 2006 到 2017 年的推特，发现假消息比真消息传得更远、更快：「Falsehood diffused significantly farther, faster, deeper, and more broadly than the truth」。另一项汇总了 51 个研究的分析也发现，一句话听得越多次，人就越觉得它是真的。转的人多，只说明它好转，不说明它是真的。",
  "Vosoughi, Roy & Aral (2018), studying Twitter 2006–2017: \"Falsehood diffused significantly farther, faster, deeper, and more broadly than the truth.\" A meta-analysis of 51 studies (Dechêne et al., 2010) also found that repetition makes claims feel truer. Many shares means easy to share, not true.",
  "https://doi.org/10.1126/science.aap9559", "Vosoughi, Roy & Aral (2018), Science; Dechêne et al. (2010)");
paper("survey", HEAD_REAL,
  "Rogelberg 等人（2000）研究员工满意度调查，发现不肯填问卷的员工「possessed greater intentions to quit, less organizational commitment, and less satisfaction」（更想离职、对公司更没感情、也更不满意）。所以只看填了的人，结果会比实际好。",
  "Rogelberg et al. (2000) found employees who skip attitude surveys \"possessed greater intentions to quit, less organizational commitment, and less satisfaction toward supervisors and their own jobs\" — so results from responders look rosier than reality.",
  "https://doi.org/10.1037/0021-9010.85.2.284", "Rogelberg et al. (2000), Journal of Applied Psychology");
paper("vendor", HEAD_REAL,
  "Baron 和 Hershey（1988）让人评价别人做的决定。一模一样的决定，结果好的时候，大家觉得那个人「想得比较好、比较能干」；结果不好，就觉得他差。原文：「Although subjects who were asked felt that they should not consider outcomes in making these evaluations, they did so」（他们自己也说不该看结果，可还是看了）。",
  "Baron & Hershey (1988): the same decision was rated as better thinking by a more competent person when it turned out well. \"Although subjects who were asked felt that they should not consider outcomes in making these evaluations, they did so.\"",
  "https://doi.org/10.1037/0022-3514.54.4.569", "Baron & Hershey (1988), Journal of Personality and Social Psychology");
paper("fridge", ["经典例子（情景是编的）", "Classic example (scenario invented)"],
  "这是「幸存者偏差」最有名的例子：二战时，统计学家 Wald 研究飞机哪里最需要加强，手上只有飞回来的飞机，被打下来的都不在数据里。原文：「Abraham Wald worked on the problem of estimating the vulnerability of aircraft, using data obtained from survivors」。冰箱也一样：你看到的老冰箱，都是没坏的那些。",
  "The classic case of survivorship bias: in WWII, statistician Abraham Wald studied where planes were vulnerable using only planes that made it back — \"using data obtained from survivors\". Old fridges are the same: you only see the ones that didn't break.",
  "https://doi.org/10.1080/01621459.1984.10478038", "Mangel & Samaniego (1984), Journal of the American Statistical Association");
paper("nap", HEAD_REAL,
  "Goyal 等人（2014）在《美国医学会杂志·内科》汇总了 47 个随机分组的冥想研究（3,515 人），而且只算有「对照组」的研究。结论是冥想对压力的效果是「small to moderate」（小到中等），对压力本身只有「low evidence」（证据不强）；跟其他有效的做法比，「We found no evidence that meditation programs were better than any active treatment」（没有证据比其他做法更好）。只看「上课的人压力降了 30%」，会把效果看得太大。",
  "Goyal et al. (2014, JAMA Internal Medicine) pooled 47 randomized trials (3,515 people) with control groups. Meditation produced \"small to moderate reductions of multiple negative dimensions of psychological stress\", with only \"low evidence of improved stress/distress\", and \"no evidence that meditation programs were better than any active treatment.\" Looking only at attendees' 30% drop overstates the effect.",
  "https://jamanetwork.com/journals/jamainternalmedicine/fullarticle/1809754", "Goyal et al. (2014), JAMA Internal Medicine");

// The ward: 20 patients you can see. Nothing says how to split them; each kind recovers at its own pace anyway.

const TRAIT_SHIFT = { sport: -1.3, hand: -1.0, plain: 0, old: 1.0, cough: 1.3 };
function makePatients() {
  const traits = shuffled(["sport", "sport", "sport", "sport", "hand", "hand", "hand", "hand", "plain", "plain", "plain", "plain", "old", "old", "old", "old", "cough", "cough", "cough", "cough"], Math.random);
  return traits.map((trait, i) => ({ trait, x: 10 + (i % 10) * 14, y: i < 10 ? 28 : 50 }));
}
function runTrial() {
  if (st.daysLeft < 1 || st.walking) return;
  st.daysLeft--; renderBar();
  walkTo(60 + (st.runs.length % 2) * 30, () => {
    const L = st.lab, r = mulberry32(1000 + st.runs.length * 7 + L.sel.size);
    const effect = CS[ci].herbWorks ? -1.6 : 0;   // in the "claim is right" version the herb really helps
    const days = st.pats.map((p, i) => Math.max(1, 5 + TRAIT_SHIFT[p.trait] + gauss(r) * 1.2 + (L.sel.has(i) ? effect : 0)));
    const herb = days.filter((_, i) => L.sel.has(i)), none = days.filter((_, i) => !L.sel.has(i));
    const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
    const run = { sel: new Set(L.sel), days, herb, none, ah: avg(herb), an: none.length ? avg(none) : null };
    st.runs.push(run);
    let note = t("trialPick", { k: st.runs.length, a: herb.length, x: run.ah.toFixed(1), b: none.length });
    if (run.an != null) { const d = run.an - run.ah; note += t("trialNone", { b: run.an.toFixed(1) }) + (Math.abs(d) < .3 ? t("same") : d > 0 ? t("faster", { d: d.toFixed(1) }) : t("slower", { d: (-d).toFixed(1) })); }
    else note += t("noCompare");
    st.notes.push(note); st.unread++;
    st.toolsHere = st.toolsHere || new Set();
    // a fair split: the two groups' built-in recovery speeds are about the same
    const mean = idx => idx.reduce((a, i) => a + TRAIT_SHIFT[st.pats[i].trait], 0) / idx.length;
    const all = st.pats.map((_, i) => i), fair = Math.abs(mean(all.filter(i => L.sel.has(i))) - mean(all.filter(i => !L.sel.has(i)))) < .35;
    st.toolsHere.add("control");

    drawScene(); renderBar();
    const says = t("herbSay");
    const say = run.an == null ? says[0] : run.an - run.ah > .8 ? says[1] : says[2];
    const out = st.daysLeft < 1;
    if (out) { mode = "verdict"; renderPanel(); }
    talk("herbal", [say], () => talk("you", out ? [note, t("outOfTime")] : [note]));
  });
}

    <div class="row2"><button class="ghost" id="howB">${t("tutTitle")}</button><button class="ghost" id="go">${t("seeMap")}</button></div>`);
  bindLang(intro);
  document.getElementById("howB").onclick = () => tutorial(0, intro);
  document.getElementById("best").onclick = () => firstTime(() => {
    const first = ORDER.find(id => townOpen(CHAPTERS.find(c => c.id === id)) && leftIn(CHAPTERS.find(c => c.id === id))) || ORDER[0];
    const fresh = !(prog.history || []).length;   // a new player walks in from the left edge of the map
    showMap(first, true, fresh ? [-8, MAPXY[first][1]] : null);
  });
  document.getElementById("go").onclick = () => firstTime(closeSheet);
}
const firstTime = then => prog.tut ? then() : tutorial(0, then);
// a short how-to-play, one idea per page
function tutorial(i, then) {
  const steps = UI.tut, s = steps[i], last = i === steps.length - 1;
  $sheet.dataset.lock = "1"; delete $sheet.dataset.back;
  openSheet(`<p class="sub">${t("tutTitle")} · ${i + 1} / ${steps.length}</p>
    <div class="tutpic">${s.pic}</div>
    <h2>${tc(s.h)}</h2>
    <div style="font-size:15px">${tc(s.b)}</div>
    <div class="dots">${steps.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("")}</div>
    <div class="row2"><button class="ghost" id="tutSkip">${i ? t("tutBack") : t("tutSkip")}</button><button class="primary" id="tutNext">${last ? t("tutGo") : t("tutNext")}</button></div>`);
  const done = () => { prog.tut = true; save(); closeSheet(); then(); };
  document.getElementById("tutNext").onclick = () => last ? done() : tutorial(i + 1, then);
  document.getElementById("tutSkip").onclick = () => i ? tutorial(i - 1, then) : done();
}
intro();
</script>
